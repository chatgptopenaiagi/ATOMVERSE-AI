[project]
name = "atomverse-ai"
version = "0.1.0a1"
description = "A local computational universe driven by measured events"
requires-python = ">=3.14,<3.16"
dependencies = ["PySide6==6.11.0", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3", "jsonschema>=4.23"]

[tool.pytest.ini_options]
pythonpath = ["SOFTWARE"]
testpaths = ["TESTS"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["SOFTWARE"]
