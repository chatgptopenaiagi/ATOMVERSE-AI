[project]
name = "atomverse-ai"
version = "0.2.0a2"
description = "A local computational universe driven by measured events"
requires-python = ">=3.14,<3.16"
dependencies = ["PySide6==6.11.0", "psutil==7.2.2"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
atomverse-ai = "atomverse.cli:main"

[project.urls]
Repository = "https://github.com/chatgptopenaiagi/ATOMVERSE-AI"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3", "jsonschema>=4.23"]

[tool.pytest.ini_options]
pythonpath = ["SOFTWARE"]
testpaths = ["TESTS"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["SOFTWARE"]
include = ["atomverse*"]

[tool.setuptools.data-files]
"share/atomverse-ai" = ["ATOMVERSE-EVENT-SCHEMA.json", "LICENSE-DECISION.md", "THIRD-PARTY-NOTICES.md"]
"share/atomverse-ai/LICENSES" = ["LICENSES/*.txt"]
